[package]
name = "fae"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
fae-agent = { path = "../../crates/fae-agent" }
fae-engine = { path = "../../crates/fae-engine" }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde_json = { workspace = true }
serde = { workspace = true }
futures-util = "0.3"
tokio-tungstenite = "0.28"
fs2 = "0.4"
chrono = "0.4"
tokio = { workspace = true }
tokio-stream = { workspace = true }
tui-markdown = { version = "0.3.9", default-features = false }
unicode-width = "0.2"
wd_tools = { workspace = true }
larksuite-oapi-sdk-rs = { version = "=0.3.13", features = ["ws"] }
sha2 = "0.10"
http = "1"

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.15"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
