[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fae-plugin-py"
version = "0.1.0"
description = "Typed Python plugins for the FAE agent engine"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fae_plugin = ["py.typed"]
